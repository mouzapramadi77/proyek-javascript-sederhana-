<!DOCTYPE html>
<html>
<head>
    <title>Proyek JavaScript</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
        #hasil { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px; min-height: 50px; }
    </style>
</head>
<body>
    <h1>🚀 Proyek JavaScript Pertamaku</h1>
    
    <button onclick="tampilPesan()">Klik Saya!</button>
    <button onclick="hitungAngka()">Hitung Angka</button>
    
    <div id="hasil"></div>

    <script src="script.js"></script>
</body>
</html>
